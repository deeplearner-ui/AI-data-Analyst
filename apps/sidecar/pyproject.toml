[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aida-sidecar"
version = "0.1.0"
description = "Local analysis service for AI Data Analyst"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pydantic>=2.10",
  "pandas>=2.2",
  "polars>=1.20",
  "pyarrow>=18",
  "duckdb>=1.2",
  "numpy>=2.0",
  "scipy>=1.14",
  "statsmodels>=0.14",
  "scikit-learn>=1.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pymysql>=1.1",
  "openpyxl>=3.1",
  "reportlab>=4.2",
  "plotly>=6.0",
  "kaleido>=1.0",
  "httpx>=0.28",
  "sqlglot>=26.0",
  "chardet>=5.2",
  "jinja2>=3.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pyinstaller>=6.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["aida_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
